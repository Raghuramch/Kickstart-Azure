name: Check app

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Test home page
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Test home page
        run: |
          python - <<'PY'
          from app import app

          with app.test_client() as client:
              response = client.get("/")
              page = response.get_data(as_text=True)
              assert response.status_code == 200
              assert "GDNaidu3.jpeg" in page
              assert "kickstart.css" in page
          PY
